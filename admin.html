<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yıldız Gross Yönetim Paneli</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,sans-serif;
    }

    body{
      background:#f5f6f8;
      color:#222;
    }

    header{
      background:#e30613;
      color:white;
      padding:20px;
      display:flex;
      justify-content:space-between;
      align-items:center;
    }

    header h1{
      font-size:24px;
    }

    header span{
      color:#ffd400;
      font-weight:bold;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:25px;
    }

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:15px;
      margin-bottom:25px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:14px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .card h3{
      color:#777;
      font-size:14px;
      margin-bottom:10px;
    }

    .card strong{
      font-size:28px;
      color:#e30613;
    }

    .menu{
      display:flex;
      gap:10px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    button{
      border:0;
      border-radius:8px;
      padding:12px 18px;
      cursor:pointer;
      font-weight:bold;
    }

    .menu button{
      background:#e30613;
      color:white;
    }

    .panel{
      background:white;
      border-radius:14px;
      padding:20px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
      margin-bottom:20px;
    }

    h2{
      margin-bottom:20px;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:13px;
      border-bottom:1px solid #eee;
      text-align:left;
    }

    th{
      background:#fafafa;
    }

    .status{
      padding:7px 10px;
      border-radius:20px;
      background:#fff3cd;
      display:inline-block;
      font-size:13px;
    }

    .action{
      background:#e30613;
      color:white;
      padding:8px 10px;
    }

    .green{
      background:#16883c;
      color:white;
    }

    .yellow{
      background:#f4b400;
      color:#111;
    }

    .hidden{
      display:none;
    }

    .form{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:10px;
      margin-bottom:20px;
    }

    input,select{
      padding:12px;
      border:1px solid #ddd;
      border-radius:8px;
      width:100%;
    }

    @media(max-width:700px){
      .container{
        padding:12px;
      }

      table{
        font-size:12px;
      }

      th,td{
        padding:8px;
      }

      header h1{
        font-size:19px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>⭐ YILDIZ <span>GROSS</span></h1>
  <div>Yönetim Paneli</div>
</header>

<div class="container">

  <div class="cards">
    <div class="card">
      <h3>Yeni Siparişler</h3>
      <strong id="orderCount">0</strong>
    </div>

    <div class="card">
      <h3>Ürün Sayısı</h3>
      <strong id="productCount">0</strong>
    </div>

    <div class="card">
      <h3>Hazırlanan Sipariş</h3>
      <strong id="preparingCount">0</strong>
    </div>

    <div class="card">
      <h3>Teslim Edilen</h3>
      <strong id="deliveredCount">0</strong>
    </div>
  </div>

  <div class="menu">
    <button onclick="showPanel('orders')">📦 Siparişler</button>
    <button onclick="showPanel('products')">🛒 Ürün Yönetimi</button>
  </div>

  <section id="orders" class="panel">
    <h2>📦 Gelen Siparişler</h2>

    <table>
      <thead>
        <tr>
          <th>Sipariş</th>
          <th>Müşteri</th>
          <th>Tutar</th>
          <th>Durum</th>
          <th>İşlem</th>
        </tr>
      </thead>

      <tbody id="ordersBody">
        <tr>
          <td colspan="5">Siparişler Supabase'den yüklenecek...</td>
        </tr>
      </tbody>
    </table>
  </section>

  <section id="products" class="panel hidden">

    <h2>🛒 Ürün Yönetimi</h2>

    <div class="form">
      <input id="productName" placeholder="Ürün adı">
      <input id="productPrice" type="number" step="0.01" placeholder="Fiyat">
      <input id="productStock" type="number" placeholder="Stok">
      <button class="green">+ Ürün Ekle</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Ürün</th>
          <th>Fiyat</th>
          <th>Stok</th>
          <th>İşlem</th>
        </tr>
      </thead>

      <tbody id="productsBody">
        <tr>
          <td colspan="4">Ürünler Supabase'den yüklenecek...</td>
        </tr>
      </tbody>
    </table>

  </section>

</div>

<script>
  function showPanel(panel){
    document.getElementById("orders").classList.add("hidden");
    document.getElementById("products").classList.add("hidden");

    document.getElementById(panel).classList.remove("hidden");
  }
</script>

</body>
</html>
