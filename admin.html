<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Yıldız Gross | Yönetim Paneli</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#222
}
header{
  background:#d71920;
  color:white;
  padding:18px;
  text-align:center
}
header h1{margin:0;font-size:26px}
header p{margin:5px 0 0;color:#ffd92f;font-weight:bold}

.container{
  max-width:1100px;
  margin:20px auto;
  padding:0 15px
}
.tabs{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:18px
}
.tabs button{
  border:0;
  background:#fff;
  padding:12px 16px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold
}
.tabs button.active{
  background:#d71920;
  color:#fff
}
.panel{
  background:white;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
  margin-bottom:18px
}
.hidden{display:none}
input,textarea,select{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ccc;
  border-radius:9px;
  font-size:15px
}
button.action{
  background:#18a957;
  color:white;
  border:0;
  padding:12px 18px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold
}
button.red{background:#d71920}
button.blue{background:#1677d2}
.message{
  margin-top:12px;
  font-weight:bold
}
.card{
  border:1px solid #ddd;
  padding:15px;
  margin:10px 0;
  border-radius:12px
}
.card h3{margin-top:0}
.price{
  font-size:20px;
  font-weight:bold;
  color:#d71920
}
.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  background:#fff3cd;
  font-weight:bold
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
  gap:12px
}
.stat{
  background:white;
  padding:18px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 3px 15px rgba(0,0,0,.07)
}
.stat strong{
  display:block;
  font-size:28px;
  color:#d71920
}
.small{font-size:13px;color:#666}
</style>
</head>

<body>

<header>
  <h1>⭐ YILDIZ GROSS</h1>
  <p>Yönetim Paneli</p>
</header>

<div class="container">

<div class="grid">
  <div class="stat">
    <strong id="orderCount">-</strong>
    Toplam Sipariş
  </div>
  <div class="stat">
    <strong id="productCount">-</strong>
    Ürün
  </div>
</div>

<br>

<div class="tabs">
  <button class="active" onclick="showPanel('orders',this)">📦 Siparişler</button>
  <button onclick="showPanel('products',this)">🛒 Ürünler</button>
  <button onclick="showPanel('settings',this)">⚙️ Market Ayarları</button>
</div>

<div id="orders" class="panel">
  <h2>📦 Gelen Siparişler</h2>
  <button class="action blue" onclick="loadOrders()">Yenile</button>
  <div id="ordersList">Yükleniyor...</div>
</div>

<div id="products" class="panel hidden">
  <h2>🛒 Ürün Yönetimi</h2>
  <button class="action blue" onclick="loadProducts()">Ürünleri Yenile</button>
  <div id="productsList">Yükleniyor...</div>
</div>

<div id="settings" class="panel hidden">

  <h2>⚙️ Market Ayarları</h2>

  <label>Market Adı</label>
  <input id="storeName">

  <label>Yönetici Adı</label>
  <input id="managerName">

  <label>Telefon Numarası</label>
  <input id="phone">

  <label>Adres</label>
  <textarea id="address"></textarea>

  <label>Logo Adresi (URL)</label>
  <input id="logoUrl" placeholder="https://...">

  <button class="action" onclick="saveSettings()">
    Ayarları Kaydet
  </button>

  <div id="settingsMessage" class="message"></div>

</div>

</div>

<script>

let CFG={url:"",key:""};

async function boot(){

  try{

    CFG=await (await fetch("/api/config")).json();

    if(!CFG.url || !CFG.key){
      throw new Error("Supabase bağlantı bilgileri alınamadı.");
    }

    await Promise.all([
      loadOrders(),
      loadProducts(),
      loadSettings()
    ]);

  }catch(e){
    alert("Bağlantı hatası: "+e.message);
  }

}

function headers(){
  return{
    "apikey":CFG.key,
    "Authorization":"Bearer "+CFG.key,
    "Content-Type":"application/json"
  };
}

async function rest(path,opt={}){

  const r=await fetch(
    CFG.url+"/rest/v1/"+path,
    {
      ...opt,
      headers:{
        ...headers(),
        ...(opt.headers||{})
      }
    }
  );

  if(!r.ok){
    const t=await r.text();
    throw new Error(t || ("HTTP "+r.status));
  }

  if(r.status===204)return null;

  const text=await r.text();

  return text ? JSON.parse(text) : null;
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function money(n){
  return Number(n||0).toLocaleString(
    "tr-TR",
    {
      style:"currency",
      currency:"TRY"
    }
  );
}

function showPanel(id,btn){

  document.querySelectorAll(".panel")
    .forEach(x=>x.classList.add("hidden"));

  document.getElementById(id)
    .classList.remove("hidden");

  document.querySelectorAll(".tabs button")
    .forEach(x=>x.classList.remove("active"));

  btn.classList.add("active");
}

async function loadOrders(){

  const box=document.getElementById("ordersList");

  box.innerHTML="<p>Yükleniyor...</p>";

  try{

    const data=await rest(
      "orders?select=*&order=created_at.desc"
    );

    document.getElementById("orderCount").textContent=
      data?.length||0;

    if(!data || !data.length){
      box.innerHTML="<p>Henüz sipariş bulunmuyor.</p>";
      return;
    }

    box.innerHTML=data.map(o=>`

      <div class="card">

        <h3>
          Sipariş #${esc(o.order_number || o.id)}
        </h3>

        <p>
          <b>Durum:</b>
          <span class="status">${esc(o.status||"Sipariş Alındı")}</span>
        </p>

        ${
          o.total_amount!=null
          ? `<p class="price">${money(o.total_amount)}</p>`
          : ""
        }

        ${
          o.payment_method
          ? `<p><b>Ödeme:</b> ${esc(o.payment_method)}</p>`
          : ""
        }

        ${
          o.created_at
          ? `<p class="small">${new Date(o.created_at).toLocaleString("tr-TR")}</p>`
          : ""
        }

        <select id="status-${o.id}">
          <option>Sipariş Alındı</option>
          <option>Hazırlanıyor</option>
          <option>Yola Çıktı</option>
          <option>Teslim Edildi</option>
          <option>İptal Edildi</option>
        </select>

        <button
          class="action"
          onclick="updateOrderStatus('${o.id}')">
          Durumu Güncelle
        </button>

      </div>

    `).join("");

    data.forEach(o=>{

      const s=document.getElementById("status-"+o.id);

      if(s && o.status){
        [...s.options].forEach(op=>{
          if(op.value===o.status)s.value=o.status;
        });
      }

    });

  }catch(e){

    box.innerHTML=
      `<p style="color:red">Siparişler alınamadı: ${esc(e.message)}</p>`;
  }

}

async function updateOrderStatus(id){

  const status=
    document.getElementById("status-"+id).value;

  try{

    await rest(
      "orders?id=eq."+encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({status})
      }
    );

    alert("Sipariş durumu güncellendi.");

    loadOrders();

  }catch(e){
    alert("Güncellenemedi: "+e.message);
  }

}

async function loadProducts(){

  const box=document.getElementById("productsList");

  box.innerHTML="<p>Yükleniyor...</p>";

  try{

    const data=await rest(
      "products?select=*&order=name.asc"
    );

    document.getElementById("productCount").textContent=
      data?.length||0;

    if(!data || !data.length){
      box.innerHTML="<p>Ürün bulunamadı.</p>";
      return;
    }

    box.innerHTML=data.map(p=>`

      <div class="card">

        <h3>${esc(p.name)}</h3>

        ${
          p.price!=null
          ? `<p class="price">${money(p.price)}</p>`
          : ""
        }

        ${
          p.stock!=null
          ? `<p><b>Stok:</b> ${esc(p.stock)}</p>`
          : ""
        }

        <label>Yeni fiyat</label>

        <input
          type="number"
          step="0.01"
          id="price-${p.id}"
          value="${esc(p.price)}">

        <button
          class="action"
          onclick="updateProductPrice('${p.id}')">
          Fiyatı Güncelle
        </button>

      </div>

    `).join("");

  }catch(e){

    box.innerHTML=
      `<p style="color:red">Ürünler alınamadı: ${esc(e.message)}</p>`;
  }

}

async function updateProductPrice(id){

  const input=document.getElementById("price-"+id);

  const price=Number(input.value);

  if(!Number.isFinite(price)){
    alert("Geçerli bir fiyat gir.");
    return;
  }

  try{

    await rest(
      "products?id=eq."+encodeURIComponent(id),
      {
        method:"PATCH",
        headers:{
          "Prefer":"return=minimal"
        },
        body:JSON.stringify({price})
      }
    );

    alert("Ürün fiyatı güncellendi.");

    loadProducts();

  }catch(e){
    alert("Fiyat güncellenemedi: "+e.message);
  }

}

async function loadSettings(){

  try{

    const data=await rest(
      "store_settings?select=*&limit=1"
    );

    if(!data || !data.length)return;

    const s=data[0];

    storeName.value=s.store_name||"";
    managerName.value=s.manager_name||"";
    phone.value=s.phone||"";
    address.value=s.address||"";
    logoUrl.value=s.logo_url||"";

  }catch(e){

    console.log("Market ayarları:",e.message);

  }

}

async function saveSettings(){

  const message=
    document.getElementById("settingsMessage");

  message.style.color="#333";
  message.textContent="Kaydediliyor...";

  try{

    const existing=await rest(
      "store_settings?select=id&limit=1"
    );

    const payload={
      store_name:storeName.value.trim(),
      manager_name:managerName.value.trim(),
      phone:phone.value.trim(),
      address:address.value.trim(),
      logo_url:logoUrl.value.trim(),
      updated_at:new Date().toISOString()
    };

    if(existing && existing.length){

      await rest(
        "store_settings?id=eq."+
        encodeURIComponent(existing[0].id),
        {
          method:"PATCH",
          headers:{
            "Prefer":"return=minimal"
          },
          body:JSON.stringify(payload)
        }
      );

    }else{

      await rest(
        "store_settings",
        {
          method:"POST",
          headers:{
            "Prefer":"return=minimal"
          },
          body:JSON.stringify(payload)
        }
      );

    }

    message.style.color="green";

    message.textContent=
      "✓ Market bilgileri başarıyla kaydedildi.";

  }catch(e){

    message.style.color="red";

    message.textContent=
      "Kaydedilemedi: "+e.message;
  }

}

boot();

</script>

</body>
</html>
