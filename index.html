<!doctype html><html lang='tr'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#d71920'><link rel='manifest' href='manifest.json'><link rel='icon' href='icons/icon.svg'><title>Yıldız Gross Market</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f6f6;color:#171717}.top{background:#d71920;color:white;padding:18px 16px 22px;position:sticky;top:0;z-index:3}.brand{font-size:25px;font-weight:900}.brand span{color:#ffd400}.sub{font-size:12px;opacity:.9}.search{margin-top:13px;background:white;border:0;border-radius:12px;padding:12px;color:#333;width:100%;font-size:15px}.wrap{max-width:720px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#d71920,#92070b);border-radius:18px;color:white;padding:20px;box-shadow:0 8px 24px #0002}.hero b{font-size:25px}.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.cat{background:white;padding:12px 4px;text-align:center;border-radius:12px;font-size:12px;box-shadow:0 2px 8px #0001}.products{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:14px;padding:12px;box-shadow:0 2px 10px #0001}.pic{height:110px;border-radius:10px;background:#f1f1f1;display:flex;align-items:center;justify-content:center;font-size:45px;overflow:hidden}.pic img{width:100%;height:100%;object-fit:cover}.old{text-decoration:line-through;color:#999;font-size:12px}.price{font-size:20px;font-weight:800;color:#d71920}.btn{width:100%;border:0;border-radius:9px;padding:10px;background:#d71920;color:white;font-weight:bold;margin-top:8px}.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px 4px env(safe-area-inset-bottom);z-index:4}.nav button{border:0;background:none;font-size:11px}.spacer{height:70px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:end;z-index:9}.sheet{background:white;width:100%;max-width:720px;margin:auto;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;margin:6px 0 10px}.row{display:flex;gap:8px}.pay{flex:1;border:2px solid #ddd;padding:12px;border-radius:10px;text-align:center}.pay.sel{border-color:#d71920;background:#fff0f0}.cartline{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.install{background:#111}.secondary{background:#eee;color:#222}.dark{background:#222}.linkbtn{display:block;text-align:center;text-decoration:none}.x{float:right;border:0;background:#eee;border-radius:50%;width:32px;height:32px;font-size:20px}.address,.order{padding:12px;border:1px solid #eee;border-radius:10px;margin:8px 0}.notice{grid-column:1/-1;background:#fff;padding:16px;border-radius:12px}.btn:disabled{opacity:.45}.cat{border:0;cursor:pointer}.hidden{display:none}@media(min-width:700px){.products{grid-template-columns:repeat(4,1fr)}.cats{grid-template-columns:repeat(8,1fr)}}
